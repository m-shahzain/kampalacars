

<div class="dashboard">
    <h2>Seller Dashboard</h2>
    <form id="add-car-form">
        <input type="text" placeholder="Make" required>
        <input type="text" placeholder="Model" required>
        <input type="number" placeholder="Year" required>
        <input type="number" placeholder="Price ($)" required>
        <input type="file" accept="image/*" required>
        <button type="submit">Add Car</button>
        <div id="car-list" style="margin-top: 20px;">
            <h3>Your Added Cars:</h3>
            <!-- Cars will appear here -->
          </div>
    </form>
</div>
<script src="kampalacars.js"></script>
