<!-- register.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Kampala Cars</title>
  <link rel="stylesheet" href="kampalacars.css">
</head>
<body>
  <div class="auth-container">
    <h2>Register</h2>
    <form id="registerForm">
      <input type="text" id="registerName" placeholder="Name" required>
      <input type="email" id="registerEmail" placeholder="Email" required>
      <input type="password" id="registerPassword" placeholder="Password" required>
      <select id="registerUserType" required>
        <option value="">Select Role</option>
        <option value="buyer">Buyer</option>
        <option value="seller">Seller</option>
      </select>
      <button type="submit">Register</button>
    </form>
    <p>Already have an account? <a href="login.html">Login here</a></p>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>

  <!-- Firebase Init and Registration Logic -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBM_GjHzv5Z-1ZqbcCfnCySV_cFj2O5Rew",
      authDomain: "kampalacars.firebaseapp.com",
      projectId: "kampalacars",
      storageBucket: "kampalacars.appspot.com",
      messagingSenderId: "61614330009",
      appId: "1:61614330009:web:2f5d3e04b0b1117274e808"
    };
    firebase.initializeApp(firebaseConfig);

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('registerName').value;
      const email = document.getElementById('registerEmail').value;
      const password = document.getElementById('registerPassword').value;
      const userType = document.getElementById('registerUserType').value;

      if (!userType) return alert('Please select a role.');

      try {
        const userCredential = await firebase.auth().createUserWithEmailAndPassword(email, password);
        const uid = userCredential.user.uid;

        await firebase.firestore().collection('users').doc(uid).set({
          name: name,
          email: email,
          userType: userType
        });

        if (userType === 'seller') {
          window.location.href = 'dashboard.html';
        } else {
          window.location.href = 'index.html';
        }
      } catch (error) {
        alert('Registration failed: ' + error.message);
      }
    });
  </script>
</body>
</html>
