<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Car Details - Kampala Cars</title>
  <link rel="stylesheet" href="kampalacars.css">
</head>
<body>
  <header>
    <h1>Kampala Cars</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
      <a href="register.html">Register</a>
    </nav>
  </header>

  <main>
    <div class="car-details" id="carDetails"></div>

    <div class="contact-seller">
      <h2>Contact Seller</h2>
      <form id="contactForm">
        <input type="text" id="buyerName" placeholder="Your Name" required>
        <input type="email" id="buyerEmail" placeholder="Your Email" required>
        <textarea id="buyerMessage" placeholder="Your Message to Seller..." required></textarea>
        <button type="submit">Send Message</button>
      </form>
    </div>
  </main>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBM_GjHzv5Z-1ZqbcCfnCySV_cFj2O5Rew",
      authDomain: "kampalacars.firebaseapp.com",
      projectId: "kampalacars",
      storageBucket: "kampalacars.appspot.com",
      messagingSenderId: "61614330009",
      appId: "1:61614330009:web:2f5d3e04b0b1117274e808"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const urlParams = new URLSearchParams(window.location.search);
    const carId = urlParams.get('id');
    const carDetailsDiv = document.getElementById('carDetails');

    async function loadCar() {
      if (!carId) return;
      const doc = await db.collection('cars').doc(carId).get();
      if (!doc.exists) {
        carDetailsDiv.innerHTML = '<p>Car not found.</p>';
        return;
      }
      const car = doc.data();
      carDetailsDiv.innerHTML = `
        <h2>${car.make} ${car.model}</h2>
        <img src="${car.imageUrl}" alt="Car image" style="max-width: 400px;">
        <p><strong>Price:</strong> $${car.price}</p>
        <p><strong>Seller Email:</strong> ${car.seller}</p>
      `;
    }

    document.getElementById('contactForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const name = document.getElementById('buyerName').value;
      const email = document.getElementById('buyerEmail').value;
      const message = document.getElementById('buyerMessage').value;

      alert(`Message sent to seller!\n\nFrom: ${name} (${email})\n\nMessage: ${message}`);
      this.reset();
    });

    loadCar();
  </script>
</body>
</html>
