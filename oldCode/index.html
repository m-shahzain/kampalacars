<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kampala Cars - Home</title>
  <link rel="stylesheet" href="kampalacars.css" />
</head>
<body>
  <header>
    <h1>Kampala Cars</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="login.html">Login</a>
      <a href="register.html">Register</a>
      <a href="upload.html">Upload car</a>
    </nav>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search cars by model, make or price...">
      <button onclick="searchCars()">Search</button>
    </div>
  </header>

  <main>
    <div id="carList" class="car-list"></div>
  </main>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>

  <!-- Firebase Init -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBM_GjHzv5Z-1ZqbcCfnCySV_cFj2O5Rew",
      authDomain: "kampalacars.firebaseapp.com",
      projectId: "kampalacars",
      storageBucket: "kampalacars.appspot.com",
      messagingSenderId: "61614330009",
      appId: "1:61614330009:web:2f5d3e04b0b1117274e808"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
  </script>

  <!-- Car Fetch and Search -->
  <script>
    async function fetchCars() {
      const carList = document.getElementById('carList');
      carList.innerHTML = '';

      try {
        const snapshot = await db.collection("cars").orderBy("timestamp", "desc").get();
        snapshot.forEach((doc) => {
          const car = doc.data();
          const card = document.createElement('div');
          card.className = 'car-card';
          card.innerHTML = `
            <img src="${car.imageUrl}" alt="Car image" />
            <h3>${car.make} ${car.model}</h3>
            <p>${car.description}</p>
            <p><strong>Price:</strong> $${car.price}</p>
            <button onclick="viewDetails('${doc.id}')">View Details</button>
          `;
          carList.appendChild(card);
        });
      } catch (error) {
        console.error("Failed to fetch cars:", error);
        carList.innerHTML = "<p style='text-align:center;'>Failed to load cars. Please try again later.</p>";
      }
    }

    function viewDetails(carId) {
      window.location.href = `car-details.html?id=${carId}`;
    }

    function searchCars() {
      const searchText = document.getElementById('searchInput').value.toLowerCase();
      const cards = document.querySelectorAll('.car-card');
      cards.forEach(card => {
        const text = card.textContent.toLowerCase();
        card.style.display = text.includes(searchText) ? 'block' : 'none';
      });
    }

    window.onload = fetchCars;
  </script>
</body>
</html>
