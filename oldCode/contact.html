<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Kampala Cars</title>
    <link rel="stylesheet" href="kampalacars.css">
</head>
<body>
    <header>
        <h1>KAMPALA CARS</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
        </nav>
    </header>

    <main>
        <section class="contact-section">
            <h2>Contact Us</h2>
            
            <div class="contact-container">
                <div class="contact-info">
                    <h3>Get in Touch</h3>
                    <p><strong>Address:</strong> Plot 42, Kampala Road, Uganda</p>
                    <p><strong>Phone:</strong> +256 700 123456</p>
                    <p><strong>Email:</strong> info@kampalacars</p>
                    
                    <h3>Business Hours</h3>
                    <p>Monday - Saturday: 8:00 AM - 6:00 PM</p>
        
                </div>
                
                <form id="contactForm" class="contact-form">
                    <h3>Send a Message</h3>
                    <input type="text" placeholder="Your Name" required>
                    <input type="email" placeholder="Your Email" required>
                    <input type="tel" placeholder="Phone Number">
                    <select required>
                        <option value="">Select Subject</option>
                        <option value="buying">Car Buying Inquiry</option>
                        <option value="selling">Car Selling Inquiry</option>
                        <option value="support">Technical Support</option>
                    </select>
                    <textarea placeholder="Your Message" required></textarea>
                    <button type="submit">Send Message</button>
                </form>
            </div>
            
            <div class="map-container">
                <iframe src="https://maps.google.com/maps?q=Kampala&output=embed" 
                        width="100%" 
                        height="400" 
                        frameborder="0" 
                        style="border:0; border-radius: 8px;">
                </iframe>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 Kampala Cars. All rights reserved.</p>
    </footer>

    <script src="kampalacars.js"></script>
</body>
</html>
