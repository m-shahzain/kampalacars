<!-- login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Kampala Cars</title>
  <link rel="stylesheet" href="kampalacars.css">
</head>
<body>
    <header>
        <h1>Kampala Cars</h1>
        <nav>
          <a href="index.html">Home</a>
          <a href="about.html">About</a>
          <a href="contact.html">Contact</a>
          <a href="login.html">Login</a>
          <a href="register.html">Register</a>
        </nav>
        <div class="search-bar">
          <input type="text" id="searchInput" placeholder="Search cars by model, make or price...">
          <button onclick="searchCars()">Search</button>
        </div>
      </header>
      
  <div class="auth-container">
    <h2>Login</h2>
    <form id="loginForm">
      <input type="email" id="loginEmail" placeholder="Email" required>
      <input type="password" id="loginPassword" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
    <p>Don't have an account? <a href="register.html">Register here</a></p>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-storage-compat.js"></script>

  <!-- Firebase Init and Logic -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBM_GjHzv5Z-1ZqbcCfnCySV_cFj2O5Rew",
      authDomain: "kampalacars.firebaseapp.com",
      projectId: "kampalacars",
      storageBucket: "kampalacars.appspot.com",
      messagingSenderId: "61614330009",
      appId: "1:61614330009:web:2f5d3e04b0b1117274e808"
    };
    firebase.initializeApp(firebaseConfig);

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;

      try {
        const userCredential = await firebase.auth().signInWithEmailAndPassword(email, password);

        // Optional: redirect based on role
        const userDoc = await firebase.firestore().collection('users').doc(userCredential.user.uid).get();
        const userType = userDoc.exists ? userDoc.data().userType : 'buyer';

        if (userType === 'seller') {
          window.location.href = 'dashboard.html';
        } else {
          window.location.href = 'index.html';
        }
      } catch (error) {
        alert('Login failed: ' + error.message);
      }
    });
  </script>
</body>
</html>
